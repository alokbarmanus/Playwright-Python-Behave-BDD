name: CI Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run tests (dev, sit, uat)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - sit
          - uat
      platform:
        description: 'Platform to run tests (ubuntu-latest, windows-latest, macos-latest)'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      browser:
        description: 'Browser to run tests (chromium, firefox, webkit)'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - edge
          - chrome

jobs:
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        env: [dev]
        platform: [ubuntu-latest]
        browser: [chromium]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave
      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps
      - name: Run Automation Script (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          HEADLESS: "true"
        run: |
          chmod +x ./run_automation.sh
          ./run_automation.sh ${{ matrix.env }}
      - name: Run Automation Script (Windows)
        if: runner.os == 'Windows'
        env:
          HEADLESS: "true"
        run: |
          .\run_automation.bat ${{ matrix.env }}
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.platform }}-${{ matrix.env }}-${{ matrix.browser }}
          path: allure-report
