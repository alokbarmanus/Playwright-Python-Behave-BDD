name: CI Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave
      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps

  test:
    needs: build
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        env: [dev, sit, uat]
        execution: [sequential, parallel]
        platform: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave
      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps
      - name: Run Behave Tests
        env:
          ENV: ${{ matrix.env }}
        run: |
          if [ "${{ matrix.execution }}" = "parallel" ]; then
            behave -D ENV=${{ matrix.env }} --tags=@regression --no-capture -f allure_behave.formatter:AllureFormatter -o allure-results --processes 4 --parallel-element scenario
          else
            behave -D ENV=${{ matrix.env }} --tags=@regression --no-capture -f allure_behave.formatter:AllureFormatter -o allure-results
          fi
      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.platform }}-${{ matrix.env }}-${{ matrix.execution }}-${{ matrix.browser }}
          path: allure-report
