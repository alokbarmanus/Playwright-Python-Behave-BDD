name: CI Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run tests (dev, sit, uat)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - sit
          - uat
      platform:
        description: 'Platform to run tests (ubuntu-latest, windows-latest, macos-latest)'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      browser:
        description: 'Browser to run tests (chromium, firefox, webkit)'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - edge
          - chrome

jobs:
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        env: [dev]
        platform: [ubuntu-latest]
        browser: [chromium]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave
          pip install behave-html-formatter
      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps

      - name: Install Allure CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre wget
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure_2.27.0-1_all.deb
          sudo dpkg -i allure_2.27.0-1_all.deb
          allure --version

      - name: Install Allure CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install allure.commandline --version=2.27.0 -y
          refreshenv
          allure --version
      - name: Run Automation Script (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          HEADLESS: "true"
        run: |
          chmod +x ./run_automation.sh
          ./run_automation.sh ${{ matrix.env }}
          behave -f behave_html_formatter:HTMLFormatter -o behave-report.html
      - name: Run Automation Script (Windows)
        if: runner.os == 'Windows'
        env:
          HEADLESS: "true"
        run: |
          .\run_automation.bat ${{ matrix.env }}
          behave -f behave_html_formatter:HTMLFormatter -o behave-report.html
      - name: Prepare Behave HTML Report for History
        run: |
          mkdir -p gh-pages-history/run-${{ github.run_number }}
          cp behave-report.html gh-pages-history/run-${{ github.run_number }}/index.html
      - name: Prepare Allure and Behave HTML Reports for History
        run: |
          mkdir -p gh-pages-history/run-allure-report-${{ github.run_number }}
          mkdir -p gh-pages-history/run-behave-report-${{ github.run_number }}
          cp -r allure-report/* gh-pages-history/run-allure-report-${{ github.run_number }}/
          cp behave-report.html gh-pages-history/run-behave-report-${{ github.run_number }}/index.html
      - name: Deploy Behave HTML Report History to GitHub Pages
        if: github.ref == 'refs/heads/main' # Only deploy from main branch (optional, adjust as needed)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-history
          publish_branch: gh-pages
          force_orphan: false
      - name: Upload Behave HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: behave-html-report
          path: behave-report.html
